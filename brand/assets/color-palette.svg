<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <!-- Cream bg subtle -->
  <rect width="800" height="320" fill="#F5F1E8"/>

  <style>
    .eyebrow { font: 600 10px Inter, sans-serif; fill: #4A4A4A; letter-spacing: 3px; }
    .title   { font: 800 22px 'Playfair Display', Georgia, serif; fill: #1A1A1A; letter-spacing: 1px; }
    .label   { font: 700 14px 'Playfair Display', Georgia, serif; }
    .hex     { font: 500 10px 'JetBrains Mono', monospace; opacity: 0.85; }
    .role    { font: 400 9px Inter, sans-serif; opacity: 0.7; }
    .dark    { fill: #1A1A1A; }
    .light   { fill: #FAF7F0; }
  </style>

  <text x="40" y="46" class="eyebrow dark">PALETTE · EDITORIAL EDITION</text>
  <text x="40" y="76" class="title">Color System</text>

  <!-- Row 1: 3 primary swatches (big hero blocks, editorial spacing) -->
  <g transform="translate(40, 110)">
    <!-- Cream (main bg) -->
    <rect width="180" height="160" fill="#FAF7F0" stroke="#E8E4DA" stroke-width="1"/>
    <text x="14" y="28" class="label dark">Cream Paper</text>
    <text x="14" y="46" class="hex dark">#F5F1E8</text>
    <text x="14" y="138" class="role dark">PRIMARY BACKGROUND</text>
    <text x="14" y="150" class="role dark">Page surface, body</text>

    <!-- Ink -->
    <rect x="200" width="180" height="160" fill="#1A1A1A"/>
    <text x="214" y="28" class="label light">Ink</text>
    <text x="214" y="46" class="hex light">#1A1A1A</text>
    <text x="214" y="138" class="role light">PRIMARY TEXT</text>
    <text x="214" y="150" class="role light">Headlines, body copy</text>

    <!-- Mustard accent -->
    <rect x="400" width="320" height="160" fill="#E8B547"/>
    <text x="414" y="28" class="label dark">Mustard Accent</text>
    <text x="414" y="46" class="hex dark">#E8B547</text>
    <text x="414" y="138" class="role dark">ACCENT · BLOCKS · EYEBROW BACKGROUND · CTA</text>
  </g>

  <!-- Row 2: support neutrals (smaller, editorial style) -->
  <g transform="translate(40, 286)">
    <rect width="86" height="22" fill="#4A4A4A"/>
    <text x="6" y="38" class="role dark">Charcoal · #4A4A4A</text>

    <rect x="110" width="86" height="22" fill="#8B8579"/>
    <text x="116" y="38" class="role dark">Stone · #8B8579</text>

    <rect x="220" width="86" height="22" fill="#E8E4DA"/>
    <text x="226" y="38" class="role dark">Mist · #E8E4DA</text>

    <rect x="330" width="86" height="22" fill="#C25A3E"/>
    <text x="336" y="38" class="role dark">Rust · #C25A3E</text>

    <rect x="440" width="86" height="22" fill="#6B7A4A"/>
    <text x="446" y="38" class="role dark">Moss · #6B7A4A</text>

    <rect x="550" width="86" height="22" fill="#A4795F"/>
    <text x="556" y="38" class="role dark">Clay · #A4795F</text>

    <rect x="660" width="86" height="22" fill="#5C6970"/>
    <text x="666" y="38" class="role dark">Slate · #5C6970</text>
  </g>
</svg>
